<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール調整アプリ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f6fa; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2, h3 { color: #2c3e50; }
    .header-flex { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .legend { font-size: 0.9em; color: #555; background: #f8f9fa; padding: 5px 10px; border-radius: 4px; border: 1px solid #ddd; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    input[type="text"], input[type="email"], input[type="date"], input[type="time"], input[type="password"], textarea, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-family: inherit; }
    .btn { background: #3498db; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; width: 100%; }
    .btn:hover { background: #2980b9; }
    .btn-secondary { background: #95a5a6; width: auto; padding: 8px 15px; font-size: 14px; }
    .btn-secondary:hover { background: #7f8c8d; }
    .btn-success { background: #27ae60; }
    .btn-success:hover { background: #2ecc71; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #f8f9fa; }
    .view-section { display: none; }
    .active-view { display: block; }
    .spinner { display: none; color: #e67e22; font-weight: bold; margin-top: 10px; text-align: center; }
    .dashboard-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; flex-wrap: wrap; gap: 10px; }
    .auth-tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; }
    .auth-tab.active { color: #3498db; border-bottom: 3px solid #3498db; margin-bottom: -2px; }
    .admin-panel { background: #f0f8ff; border: 2px solid #bce8f1; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
    
    #msg-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 9999; justify-content: center; align-items: center; }
    .modal-content { background: #fff; padding: 30px; border-radius: 8px; max-width: 400px; width: 90%; text-align: center; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  </style>
</head>
<body>

<div id="msg-modal">
  <div class="modal-content">
    <p id="msg-text" style="margin-bottom: 25px; font-weight: bold; color: #333; line-height: 1.5;"></p>
    <button class="btn" style="width: auto; padding: 8px 30px;" onclick="closeMessage()">OK</button>
  </div>
</div>

<div class="container">
  
  <!-- 1. ログイン / 新規登録 画面 -->
  <div id="auth-view" class="view-section">
    <div class="auth-tabs">
      <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">ログイン</div>
      <div id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">初回アカウント登録</div>
    </div>
    <div id="form-login">
      <h2>ログイン</h2>
      <div class="form-group"><label>メールアドレス</label><input type="email" id="login-email"></div>
      <div class="form-group"><label>パスワード</label><input type="password" id="login-password"></div>
      <button class="btn" onclick="executeLogin()">ログイン</button>
      <div id="login-spinner" class="spinner">認証中...</div>
    </div>
    <div id="form-register" style="display:none;">
      <h2>アカウント登録</h2>
      <div class="form-group"><label>お名前 (主催者名として表示されます)</label><input type="text" id="reg-name"></div>
      <div class="form-group"><label>メールアドレス</label><input type="email" id="reg-email"></div>
      <div class="form-group"><label>パスワード</label><input type="password" id="reg-password"></div>
      <button class="btn" onclick="executeRegister()">登録して開始</button>
      <div id="reg-spinner" class="spinner">登録中...</div>
    </div>
  </div>

  <!-- 2. ダッシュボード画面 -->
  <div id="dashboard-view" class="view-section">
    <div class="header-flex">
      <h1 id="dash-title">ダッシュボード</h1>
      <div>
        <button class="btn-secondary" onclick="logout()" style="margin-right: 10px;">ログアウト</button>
        <button class="btn" style="width:auto;" onclick="switchView('create-view')">＋ 新規イベント作成</button>
      </div>
    </div>
    <div id="event-list-container">読み込み中...</div>
  </div>

  <!-- 3. 新規作成画面 -->
  <div id="create-view" class="view-section">
    <div class="header-flex">
      <h1>新規イベント作成</h1>
      <button class="btn-secondary" onclick="loadDashboard()">戻る</button>
    </div>
    <div class="form-group"><label>イベント名</label><input type="text" id="event-name"></div>
    <div class="form-group"><label>場所</label><input type="text" id="event-location"></div>
    <div class="form-group"><label>ゲストへのメッセージ</label><textarea id="event-memo" rows="3"></textarea></div>
    
    <label>招待予定のゲスト (最終行を入力すると自動で枠が追加されます)</label>
    <table id="guest-table">
      <thead><tr><th>氏名</th><th>メールアドレス</th></tr></thead>
      <tbody id="guest-body"></tbody>
    </table>

    <label>日程候補 (最終行を入力すると自動で枠が追加されます)</label>
    <table id="candidate-table">
      <thead><tr><th>日付 (年/月/日)</th><th>時間</th></tr></thead>
      <tbody id="candidate-body"></tbody>
    </table>
    
    <div class="form-group" style="margin-top: 20px;">
      <label>回答締切</label>
      <div style="display: flex; gap: 10px;">
        <input type="date" id="event-deadline-date" style="flex: 1;">
        <input type="time" id="event-deadline-time" style="flex: 1;">
      </div>
    </div>

    <button class="btn" onclick="executeCreateEvent()">イベントを作成する</button>
    <div id="create-spinner" class="spinner">作成中...</div>
  </div>

  <!-- 4. 回答・管理画面 -->
  <div id="answer-view" class="view-section">
    <div class="header-flex">
      <h1 id="ans-title">イベント読込中...</h1>
      <div class="legend">〇：出席　×：欠席　△：未定</div>
    </div>
    
    <!-- 主催者用：管理パネル -->
    <div id="admin-panel" class="admin-panel" style="display:none;">
      <h2 style="margin-top:0; color:#31708f;">👑 主催者管理メニュー</h2>
      <div style="display:flex; flex-wrap:wrap; gap:20px;">
        <div style="flex:1; min-width:300px; background:#fff; padding:15px; border-radius:4px;">
          <h3 style="margin-top:0; color:#3498db;">1. 招待メールを送る</h3>
          <div class="form-group">
            <label>各ゲストのメールアドレス</label>
            <div id="invite-guest-list" style="background:#f9f9f9; padding:10px; border-radius:4px; max-height:200px; overflow-y:auto; margin-bottom:10px;"></div>
            <div style="border-top:1px solid #ddd; padding-top:10px; margin-top:10px;">
              <label>＋ ゲストを追加</label>
              <input type="text" id="new-guest-name" placeholder="追加する名前" style="width:150px; padding:5px; display:inline-block;">
              <button class="btn btn-secondary" onclick="executeAddGuest()">追加</button>
            </div>
          </div>
          <div class="form-group"><label>追加メッセージ</label><textarea id="invite-message" rows="2"></textarea></div>
          <button class="btn" onclick="executeSendInvites()">招待を送信</button>
          <div id="invite-spinner" class="spinner">送信中...</div>
        </div>
        
        <div style="flex:1; min-width:300px; background:#fff; padding:15px; border-radius:4px;">
          <h3 style="margin-top:0; color:#e67e22;">2. 日程を確定する</h3>
          <div class="form-group"><label>確定日時</label><select id="finalize-date"></select></div>
          <div class="form-group"><label>確定メッセージ</label><textarea id="finalize-message" rows="2"></textarea></div>
          <button class="btn" style="background:#e67e22;" onclick="executeFinalize()">確定を通知</button>
          <div id="finalize-spinner" class="spinner">送信中...</div>
        </div>
      </div>
    </div>

    <div id="ans-details" style="margin-bottom:20px; background:#f9f9f9; padding:15px; border-radius:4px; border-left:4px solid #3498db;"></div>
    
    <h2>日程アンケート</h2>
    <div id="matrix-container" style="overflow-x:auto;"></div>
    
    <div id="guest-submit-area" style="display:none; margin-top:20px; text-align:center; padding-top:20px; border-top:2px dashed #ccc;">
      <button class="btn btn-success" style="width:auto; padding:15px 40px; font-size:18px;" onclick="executeSubmitAnswer()">自分の回答を保存する</button>
      <div id="ans-spinner" class="spinner">保存中...</div>
    </div>
    
    <div style="text-align:right; margin-top:30px;">
      <a href="#" onclick="switchView('auth-view')" style="color:#999; font-size:0.8em; text-decoration:underline;">主催者ログイン</a>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // ★重要：ここにあなたのGASのURL（/exec）を貼り付けます
  // ==========================================
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyq0RHopOCeCge1nMALf-VF_Drne71YFc5ZqksSv48cZpaaLSiX2dCyvEP1ZZJT4TVTfQ/exec"; 
  
  let currentEventId = null;
  let currentGuestId = null;
  let currentEventData = null;
  let loggedInUser = null; 

  function showMessage(text) {
    document.getElementById('msg-text').innerHTML = text.replace(/\n/g, '<br>');
    document.getElementById('msg-modal').style.display = 'flex';
  }
  function closeMessage() { document.getElementById('msg-modal').style.display = 'none'; }

  function switchView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
  }

  function switchAuthTab(tab) {
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-register').style.display = 'none';
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('form-' + tab).style.display = 'block';
  }

  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('eventId');
    currentGuestId = urlParams.get('guestId');
    
    const session = localStorage.getItem('appSession');
    if (session) loggedInUser = JSON.parse(session);

    if (eventId) {
      currentEventId = eventId;
      switchView('answer-view');
      loadEventData(eventId);
    } else {
      checkAuth();
    }
    initGuestRows();
    initCandidateRows();
  };

  async function callApi(action, payload) {
    const response = await fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: action, ...payload })
    });
    const res = await response.json();
    if (res.status === "error") throw new Error(res.message);
    return res.data;
  }

  function checkAuth() {
    if (loggedInUser) { loadDashboard(); return; }
    switchView('auth-view');
    const savedEmail = localStorage.getItem('savedEmail');
    if (savedEmail) {
      document.getElementById('login-email').value = savedEmail;
      document.getElementById('login-password').focus();
    }
  }

  async function executeRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    if(!name || !email || !password) { showMessage("すべての項目を入力してください。"); return; }
    
    document.getElementById('reg-spinner').style.display = 'block';
    try {
      const user = await callApi("registerUser", { name, email, password });
      finishLogin(user);
    } catch (e) { showMessage(e.message); } 
    finally { document.getElementById('reg-spinner').style.display = 'none'; }
  }

  async function executeLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    if(!email || !password) { showMessage("入力してください。"); return; }
    
    document.getElementById('login-spinner').style.display = 'block';
    try {
      const user = await callApi("loginUser", { email, password });
      finishLogin(user);
    } catch (e) { showMessage(e.message); } 
    finally { document.getElementById('login-spinner').style.display = 'none'; }
  }

  function finishLogin(user) {
    loggedInUser = user;
    localStorage.setItem('appSession', JSON.stringify(user));
    localStorage.setItem('savedEmail', user.email);
    if (currentEventId) { switchView('answer-view'); renderAdminPanel(); } 
    else { loadDashboard(); }
  }

  function logout() {
    localStorage.removeItem('appSession');
    loggedInUser = null;
    window.location.href = window.location.origin + window.location.pathname;
  }

  async function loadDashboard() {
    switchView('dashboard-view');
    document.getElementById('dash-title').textContent = `${loggedInUser.name} さんのダッシュボード`;
    const container = document.getElementById('event-list-container');
    container.innerHTML = "読込中...";
    try {
      const events = await callApi("getDashboard", { email: loggedInUser.email });
      if (events.length === 0) { container.innerHTML = "<p>イベントはありません。</p>"; return; }
      let html = "";
      events.forEach(ev => {
        const url = window.location.origin + window.location.pathname + "?eventId=" + ev.eventId;
        html += `<div class="dashboard-item">
            <div><strong>${ev.eventName}</strong><br><small>締切: ${ev.deadline}</small></div>
            <a href="${url}" class="btn-secondary" style="text-decoration:none; color:white;">管理画面</a>
          </div>`;
      });
      container.innerHTML = html;
    } catch (e) { container.innerHTML = e.message; }
  }

  function initGuestRows() {
    const tbody = document.getElementById('guest-body');
    tbody.innerHTML = '';
    for(let i=0; i<3; i++) addGuestRow();
  }

  function addGuestRow() {
    const tbody = document.getElementById('guest-body');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="text" class="guest-name" placeholder="氏名"></td>
      <td><input type="email" class="guest-email" placeholder="メールアドレス"></td>
    `;
    tbody.appendChild(tr);

    const nameInput = tr.querySelector('.guest-name');
    const emailInput = tr.querySelector('.guest-email');

    nameInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        emailInput.focus();
      }
    });

    emailInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        const nextRow = tr.nextElementSibling;
        if (nextRow) nextRow.querySelector('.guest-name').focus();
      }
    });

    nameInput.addEventListener('input', checkAndAddGuestRow);
    emailInput.addEventListener('input', checkAndAddGuestRow);
  }

  function checkAndAddGuestRow() {
    const tbody = document.getElementById('guest-body');
    const lastRow = tbody.lastElementChild;
    if (lastRow.querySelector('.guest-name').value || lastRow.querySelector('.guest-email').value) {
      addGuestRow();
    }
  }

  function initCandidateRows() {
    const tbody = document.getElementById('candidate-body');
    tbody.innerHTML = ''; 
    for(let i=0; i<3; i++) addCandidateRow();
  }

  function addCandidateRow() {
    const tbody = document.getElementById('candidate-body');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td style="white-space:nowrap;">
        <input type="text" class="cand-year" placeholder="YYYY" maxlength="4" style="width:60px; text-align:center; display:inline-block;"> /
        <input type="text" class="cand-month" placeholder="MM" maxlength="2" style="width:40px; text-align:center; display:inline-block;"> /
        <input type="text" class="cand-day" placeholder="DD" maxlength="2" style="width:40px; text-align:center; display:inline-block;">
      </td>
      <td><input type="text" class="cand-time" placeholder="1900" maxlength="4" style="width:100px; text-align:center; display:inline-block;"></td>
    `;
    tbody.appendChild(tr);

    const yInput = tr.querySelector('.cand-year');
    const mInput = tr.querySelector('.cand-month');
    const dInput = tr.querySelector('.cand-day');
    const tInput = tr.querySelector('.cand-time');

    yInput.addEventListener('input', function() {
      if (yInput.value.length === 4) mInput.focus();
      checkAndAddCandRow();
    });
    
    mInput.addEventListener('input', function() {
      if (mInput.value.length === 2) dInput.focus();
      checkAndAddCandRow();
    });
    
    dInput.addEventListener('input', checkAndAddCandRow);
    
    dInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        tInput.focus();
      }
    });

    tInput.addEventListener('input', checkAndAddCandRow);

    tInput.addEventListener('blur', function(e) {
      let val = e.target.value.replace(":", "");
      if(val.length === 4 && !isNaN(val)) e.target.value = val.substring(0,2) + ":" + val.substring(2,4);
    });

    tInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        let val = e.target.value.replace(":", "");
        if(val.length === 4 && !isNaN(val)) e.target.value = val.substring(0,2) + ":" + val.substring(2,4);
        
        const nextRow = tr.nextElementSibling;
        if (nextRow) nextRow.querySelector('.cand-year').focus();
      }
    });
  }

  function checkAndAddCandRow() {
    const tbody = document.getElementById('candidate-body');
    const lastRow = tbody.lastElementChild;
    if (lastRow.querySelector('.cand-year').value || lastRow.querySelector('.cand-month').value || 
        lastRow.querySelector('.cand-day').value || lastRow.querySelector('.cand-time').value) {
      addCandidateRow();
    }
  }

  async function executeCreateEvent() {
    const eventName = document.getElementById('event-name').value;
    if (!eventName) { showMessage("イベント名は必須です。"); return; }

    const guests = [];
    document.querySelectorAll('#guest-body tr').forEach(tr => {
      const n = tr.querySelector('.guest-name').value.trim();
      const e = tr.querySelector('.guest-email').value.trim();
      if(n) { 
        guests.push({ id: 'g_' + Date.now() + Math.floor(Math.random()*1000) + guests.length, name: n, email: e });
      }
    });
    if (guests.length === 0) { showMessage("ゲストの氏名を1名以上入力してください。"); return; }

    const candidates = [];
    document.querySelectorAll('#candidate-body tr').forEach(tr => {
      const y = tr.querySelector('.cand-year').value.trim();
      let m = tr.querySelector('.cand-month').value.trim();
      let d = tr.querySelector('.cand-day').value.trim();
      const t = tr.querySelector('.cand-time').value.trim();
      if(y && m && d && t) {
        if(m.length === 1) m = '0' + m;
        if(d.length === 1) d = '0' + d;
        candidates.push({ date: `${y}-${m}-${d}`, time: t });
      }
    });
    if(candidates.length === 0) { showMessage("候補日時を入力してください。"); return; }

    document.getElementById('create-spinner').style.display = 'block';
    
    let deadlineDate = document.getElementById('event-deadline-date').value;
    let deadlineTime = document.getElementById('event-deadline-time').value;
    
    try {
      const res = await callApi("createEvent", { data: {
        eventName: eventName, location: document.getElementById('event-location').value,
        memo: document.getElementById('event-memo').value,
        deadline: deadlineDate + " " + deadlineTime,
        candidates: candidates, guests: guests, organizerName: loggedInUser.name, organizerEmail: loggedInUser.email
      }});
      window.location.href = window.location.origin + window.location.pathname + "?eventId=" + res.eventId;
    } catch(e) { showMessage(e.message); document.getElementById('create-spinner').style.display = 'none'; }
  }

  async function loadEventData(eventId) {
    try {
      currentEventData = await callApi("getEvent", { eventId: eventId });
      document.getElementById('ans-title').textContent = currentEventData.eventName;
      document.getElementById('ans-details').innerHTML = `
        <p style="margin:0 0 5px 0;"><strong>場所:</strong> ${currentEventData.location || "未設定"}</p>
        <p style="margin:0 0 5px 0;"><strong>主催者:</strong> ${currentEventData.organizerName}</p>
        <p style="margin:0; white-space:pre-wrap;"><strong>メッセージ:</strong><br>${currentEventData.memo || "なし"}</p>
      `;
      renderAdminPanel();
      renderMatrix();
    } catch(e) { showMessage(e.message); }
  }

  function renderAdminPanel() {
    const adminPanel = document.getElementById('admin-panel');
    if (loggedInUser && currentEventData && currentEventData.organizerEmail === loggedInUser.email) {
      adminPanel.style.display = 'block';
      
      let guestHtml = "";
      (currentEventData.guests || []).forEach(g => {
        guestHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:5px; align-items:center;">
          <span style="font-weight:bold; width:120px;">${g.name}</span>
          <input type="email" id="invite-email-${g.id}" value="${g.email || ''}" placeholder="email@example.com" style="flex:1; padding:5px;">
        </div>`;
      });
      document.getElementById('invite-guest-list').innerHTML = guestHtml;

      const select = document.getElementById('finalize-date');
      select.innerHTML = '<option value="">-- 日時を選択 --</option>';
      currentEventData.candidates.forEach(cand => {
        const dt = `${cand.date} ${cand.time}`;
        select.innerHTML += `<option value="${dt}">${dt}</option>`;
      });
    } else { adminPanel.style.display = 'none'; }
  }

  async function executeAddGuest() {
    const name = document.getElementById('new-guest-name').value.trim();
    if(!name) return;
    try {
      const newGuest = { id: 'g_' + Date.now(), name: name };
      const res = await callApi("addGuest", { data: { eventId: currentEventId, newGuest: newGuest }});
      currentEventData.guests = res.guests;
      document.getElementById('new-guest-name').value = '';
      renderAdminPanel(); renderMatrix();
      showMessage("ゲストを追加しました。リストにアドレスを入力して招待できます。");
    } catch(e) { showMessage(e.message); }
  }

  async function executeSendInvites() {
    const guestsToInvite = [];
    currentEventData.guests.forEach(g => {
      const email = document.getElementById(`invite-email-${g.id}`).value.trim();
      if(email) guestsToInvite.push({ id: g.id, name: g.name, email: email });
    });
    if(guestsToInvite.length === 0) { showMessage("メールアドレスを入力してください。"); return; }
    
    document.getElementById('invite-spinner').style.display = 'block';
    const baseUrl = window.location.origin + window.location.pathname;
    try {
      await callApi("sendInvites", { data: { eventId: currentEventId, guestsToInvite: guestsToInvite, message: document.getElementById('invite-message').value, baseUrl: baseUrl } });
      showMessage("招待メールを送信しました！");
    } catch(e) { showMessage(e.message); } 
    finally { document.getElementById('invite-spinner').style.display = 'none'; }
  }

  async function executeFinalize() {
    const date = document.getElementById('finalize-date').value;
    if(!date) { showMessage("日時を選択してください。"); return; }
    document.getElementById('finalize-spinner').style.display = 'block';
    try {
      await callApi("finalizeDate", { data: { eventId: currentEventId, fixedDate: date, message: document.getElementById('finalize-message').value } });
      showMessage("確定メールを送信しました！");
    } catch(e) { showMessage(e.message); } 
    finally { document.getElementById('finalize-spinner').style.display = 'none'; }
  }

  function renderMatrix() {
    let html = `<table><thead><tr><th>ゲスト名</th>`;
    currentEventData.candidates.forEach(cand => { html += `<th>${cand.date}<br>${cand.time}</th>`; });
    html += `</tr></thead><tbody>`;
    
    (currentEventData.guests || []).forEach(guest => {
      html += `<tr><td style="font-weight:bold;">${guest.name}</td>`;
      const ans = currentEventData.answers.find(a => a.guestId === guest.id);
      
      if (guest.id === currentGuestId) {
        currentEventData.candidates.forEach((cand, index) => {
          const mark = ans && ans.answersMap[index] ? ans.answersMap[index] : "△";
          const sO = mark === '〇' ? 'selected' : ''; const sD = mark === '△' ? 'selected' : ''; const sX = mark === '×' ? 'selected' : '';
          html += `<td><select id="ans-select-${index}" style="padding:5px; width:100%; border-radius:4px;"><option value="〇" ${sO}>〇</option><option value="△" ${sD}>△</option><option value="×" ${sX}>×</option></select></td>`;
        });
        document.getElementById('guest-submit-area').style.display = 'block';
      } else {
        currentEventData.candidates.forEach((cand, index) => {
          const mark = ans && ans.answersMap[index] ? ans.answersMap[index] : "△";
          const color = mark === '〇' ? 'color:#3498db; font-weight:bold;' : (mark === '×' ? 'color:#e74c3c;' : 'color:#999;');
          html += `<td style="${color}">${mark}</td>`;
        });
      }
      html += `</tr>`;
    });
    
    html += `</tbody></table>`;
    document.getElementById('matrix-container').innerHTML = html;
  }

  async function executeSubmitAnswer() {
    const guest = currentEventData.guests.find(g => g.id === currentGuestId);
    if(!guest) { showMessage("ゲスト情報が見つかりません。"); return; }
    
    let answersMap = {};
    currentEventData.candidates.forEach((cand, index) => {
      answersMap[index] = document.getElementById(`ans-select-${index}`).value;
    });

    document.getElementById('ans-spinner').style.display = 'block';
    try {
      await callApi("submitAnswer", { data: { eventId: currentEventId, guestId: guest.id, guestName: guest.name, guestEmail: guest.email, answersMap: answersMap } });
      showMessage("回答を保存しました！");
      setTimeout(() => { window.location.reload(); }, 1500);
    } catch(e) { showMessage(e.message); document.getElementById('ans-spinner').style.display = 'none'; }
  }
</script>
</body>
</html>
