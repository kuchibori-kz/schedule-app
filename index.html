<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スケジュール調整アプリ</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f5f6fa; color: #333; margin: 0; padding: 20px; }
    .container { max-width: 900px; margin: 0 auto; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    h1, h2 { color: #2c3e50; }
    .header-flex { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2px solid #eee; padding-bottom: 10px; margin-bottom: 20px; }
    .legend { font-size: 0.9em; color: #555; background: #f8f9fa; padding: 5px 10px; border-radius: 4px; border: 1px solid #ddd; }
    .form-group { margin-bottom: 20px; }
    label { display: block; font-weight: bold; margin-bottom: 5px; color: #555; }
    input[type="text"], input[type="email"], input[type="date"], input[type="time"], input[type="password"], textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background: #3498db; color: #fff; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; transition: 0.3s; width: 100%; }
    .btn:hover { background: #2980b9; }
    .btn-secondary { background: #95a5a6; width: auto; padding: 8px 15px; font-size: 14px; }
    .btn-secondary:hover { background: #7f8c8d; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
    th, td { border: 1px solid #ddd; padding: 10px; text-align: center; }
    th { background: #f8f9fa; }
    .view-section { display: none; }
    .active-view { display: block; }
    .spinner { display: none; color: #e67e22; font-weight: bold; margin-top: 10px; text-align: center; }
    .dashboard-item { border: 1px solid #ddd; padding: 15px; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: #fafafa; }
    
    /* 認証用タブ */
    .auth-tabs { display: flex; border-bottom: 2px solid #ddd; margin-bottom: 20px; }
    .auth-tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; font-weight: bold; color: #777; transition: 0.3s; }
    .auth-tab.active { color: #3498db; border-bottom: 3px solid #3498db; margin-bottom: -2px; }
  </style>
</head>
<body>

<div class="container">
  
  <!-- 1. ログイン / 新規登録 画面 -->
  <div id="auth-view" class="view-section">
    <div class="auth-tabs">
      <div id="tab-login" class="auth-tab active" onclick="switchAuthTab('login')">ログイン</div>
      <div id="tab-register" class="auth-tab" onclick="switchAuthTab('register')">新規アカウント登録</div>
    </div>

    <!-- ログインフォーム -->
    <div id="form-login">
      <h2>ログイン</h2>
      <p style="font-size: 0.9em; color: #666;">2回目以降はパスワードを入力するだけでダッシュボードに入れます。</p>
      <div class="form-group"><label>メールアドレス</label><input type="email" id="login-email"></div>
      <div class="form-group"><label>パスワード</label><input type="password" id="login-password"></div>
      <button class="btn" onclick="executeLogin()">ログイン</button>
      <div id="login-spinner" class="spinner">認証中...</div>
    </div>

    <!-- 登録フォーム -->
    <div id="form-register" style="display:none;">
      <h2>アカウント登録 (初回のみ)</h2>
      <div class="form-group"><label>お名前 (主催者名として表示されます)</label><input type="text" id="reg-name"></div>
      <div class="form-group"><label>メールアドレス</label><input type="email" id="reg-email"></div>
      <div class="form-group"><label>パスワード (お好きなものを設定)</label><input type="password" id="reg-password"></div>
      <button class="btn" onclick="executeRegister()">登録して開始</button>
      <div id="reg-spinner" class="spinner">登録中...</div>
    </div>
  </div>

  <!-- 2. ダッシュボード画面 -->
  <div id="dashboard-view" class="view-section">
    <div class="header-flex">
      <h1 id="dash-title">ダッシュボード</h1>
      <div>
        <button class="btn-secondary" onclick="logout()" style="margin-right: 10px;">ログアウト</button>
        <button class="btn" style="width:auto;" onclick="switchView('create-view')">＋ 新規イベント作成</button>
      </div>
    </div>
    <div id="event-list-container">読み込み中...</div>
  </div>

  <!-- 3. 新規作成画面 -->
  <div id="create-view" class="view-section">
    <div class="header-flex">
      <h1>新規イベント作成</h1>
      <button class="btn-secondary" onclick="loadDashboard()">戻る</button>
    </div>
    <div class="form-group"><label>イベント名</label><input type="text" id="event-name"></div>
    <div class="form-group"><label>場所</label><input type="text" id="event-location"></div>
    <div class="form-group"><label>ゲストへのメッセージ</label><textarea id="event-memo" rows="3"></textarea></div>
    <div class="form-group"><label>回答締切</label><input type="date" id="event-deadline-date"> <input type="time" id="event-deadline-time"></div>
    
    <label>日程候補 (最終行の時間を入力すると自動で枠が追加されます)</label>
    <table id="candidate-table">
      <thead><tr><th>日付</th><th>時間</th></tr></thead>
      <tbody id="candidate-body"></tbody>
    </table>
    
    <button class="btn" onclick="executeCreateEvent()">イベントを作成する</button>
    <div id="create-spinner" class="spinner">作成中...</div>
  </div>

  <!-- 4. 回答・管理画面 (ゲストはここからスタート) -->
  <div id="answer-view" class="view-section">
    <div class="header-flex">
      <h1 id="ans-title">イベント読込中...</h1>
      <div class="legend">〇：出席　×：欠席　△：未定</div>
    </div>
    <div id="ans-details" style="margin-bottom:20px; background:#f9f9f9; padding:15px; border-radius:4px; border-left:4px solid #3498db;"></div>
    
    <h2>日程アンケート</h2>
    <div id="matrix-container" style="overflow-x:auto;"></div>
    
    <div id="guest-form-area" style="margin-top:20px; border-top:2px dashed #ccc; padding-top:20px;">
      <h3 style="color:#27ae60;">あなたの回答を入力</h3>
      <div class="form-group"><label>お名前</label><input type="text" id="guest-name"></div>
      <div class="form-group"><label>メールアドレス (任意)</label><input type="email" id="guest-email"></div>
      <button class="btn" style="background:#27ae60;" onclick="executeSubmitAnswer()">回答を送信する</button>
      <div id="ans-spinner" class="spinner">送信中...</div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // ★重要：ここにあなたのGASのURL（/exec）を貼り付けます
  // ==========================================
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbyq0RHopOCeCge1nMALf-VF_Drne71YFc5ZqksSv48cZpaaLSiX2dCyvEP1ZZJT4TVTfQ/exec"; 
  
  let currentEventId = null;
  let currentEventData = null;
  let loggedInUser = null; // {name, email}

  // --- 画面の表示切り替え ---
  function switchView(viewId) {
    document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active-view'));
    document.getElementById(viewId).classList.add('active-view');
  }

  function switchAuthTab(tab) {
    document.getElementById('tab-login').classList.remove('active');
    document.getElementById('tab-register').classList.remove('active');
    document.getElementById('form-login').style.display = 'none';
    document.getElementById('form-register').style.display = 'none';
    
    document.getElementById('tab-' + tab).classList.add('active');
    document.getElementById('form-' + tab).style.display = 'block';
  }

  // --- 初期化＆ルーティング（非常に重要） ---
  window.onload = function() {
    const urlParams = new URLSearchParams(window.location.search);
    const eventId = urlParams.get('eventId');
    
    // 【仕様】URLにeventIdがある（招待メールから来た）場合は、ログイン等すべて無視して回答画面へ直行
    if (eventId) {
      currentEventId = eventId;
      switchView('answer-view');
      loadEventData(eventId);
    } else {
      // 通常アクセス（主催者）の場合はログインチェック
      checkAuth();
    }
    
    initCandidateRows();
  };

  // --- API通信用関数 ---
  async function callApi(action, payload) {
    const response = await fetch(GAS_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain" },
      body: JSON.stringify({ action: action, ...payload })
    });
    const res = await response.json();
    if (res.status === "error") throw new Error(res.message);
    return res.data;
  }

  // --- 認証機能 (ログイン/登録) ---
  function checkAuth() {
    // 過去にログインしたセッション（記憶）があれば自動ログイン
    const session = localStorage.getItem('appSession');
    if (session) {
      loggedInUser = JSON.parse(session);
      loadDashboard();
      return;
    }
    
    // なければログイン画面を表示し、過去のアドレスがあれば事前に入力しておく
    switchView('auth-view');
    const savedEmail = localStorage.getItem('savedEmail');
    if (savedEmail) {
      document.getElementById('login-email').value = savedEmail;
      document.getElementById('login-password').focus(); // パスワードにカーソルを合わせる
    }
  }

  async function executeRegister() {
    const name = document.getElementById('reg-name').value.trim();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;
    
    if(!name || !email || !password) { alert("すべての項目を入力してください。"); return; }
    
    document.getElementById('reg-spinner').style.display = 'block';
    try {
      const user = await callApi("register", { name, email, password });
      finishLogin(user);
    } catch (e) {
      alert(e.message);
    } finally {
      document.getElementById('reg-spinner').style.display = 'none';
    }
  }

  async function executeLogin() {
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    
    if(!email || !password) { alert("メールアドレスとパスワードを入力してください。"); return; }
    
    document.getElementById('login-spinner').style.display = 'block';
    try {
      const user = await callApi("login", { email, password });
      finishLogin(user);
    } catch (e) {
      alert(e.message);
    } finally {
      document.getElementById('login-spinner').style.display = 'none';
    }
  }

  function finishLogin(user) {
    loggedInUser = user;
    // ログイン状態を保存
    localStorage.setItem('appSession', JSON.stringify(user));
    // 次回オートコンプリート用にアドレスだけ記憶
    localStorage.setItem('savedEmail', user.email);
    loadDashboard();
  }

  function logout() {
    localStorage.removeItem('appSession');
    loggedInUser = null;
    checkAuth();
  }

  // --- ダッシュボード機能 ---
  async function loadDashboard() {
    switchView('dashboard-view');
    document.getElementById('dash-title').textContent = `${loggedInUser.name} さんのダッシュボード`;
    const container = document.getElementById('event-list-container');
    container.innerHTML = "読込中...";
    
    try {
      const events = await callApi("getDashboard", { email: loggedInUser.email });
      if (events.length === 0) {
        container.innerHTML = "<p>過去のイベントはありません。新しく作成してください。</p>";
        return;
      }
      
      let html = "";
      events.forEach(ev => {
        const url = window.location.origin + window.location.pathname + "?eventId=" + ev.eventId;
        html += `
          <div class="dashboard-item">
            <div><strong>${ev.eventName}</strong><br><small>締切: ${ev.deadline}</small></div>
            <a href="${url}" class="btn-secondary" style="text-decoration:none; color:white;">管理 / 回答確認</a>
          </div>
        `;
      });
      container.innerHTML = html;
    } catch (e) {
      container.innerHTML = "エラーが発生しました: " + e.message;
    }
  }

  // --- イベント作成機能 ---
  function initCandidateRows() {
    const tbody = document.getElementById('candidate-body');
    tbody.innerHTML = '';
    addCandidateRow();
  }

  function addCandidateRow() {
    const tbody = document.getElementById('candidate-body');
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><input type="date" class="cand-date"></td>
      <td><input type="text" class="cand-time" placeholder="1900" maxlength="4"></td>
    `;
    tbody.appendChild(tr);
    setupCandidateListeners(tr);
  }

  function setupCandidateListeners(row) {
    const timeInput = row.querySelector('.cand-time');
    timeInput.addEventListener('blur', function(e) {
      let val = e.target.value.replace(":", "");
      if(val.length === 4 && !isNaN(val)) e.target.value = val.substring(0,2) + ":" + val.substring(2,4);
      checkAndAddRow(row);
    });
    timeInput.addEventListener('keydown', function(e) { if(e.key === 'Enter') checkAndAddRow(row); });
  }

  function checkAndAddRow(currentRow) {
    const tbody = document.getElementById('candidate-body');
    if (currentRow.querySelector('.cand-date').value && currentRow.querySelector('.cand-time').value && currentRow === tbody.lastElementChild) {
      addCandidateRow();
    }
  }

  async function executeCreateEvent() {
    const eventName = document.getElementById('event-name').value;
    if (!eventName) { alert("イベント名は必須です。"); return; }

    const candidates = [];
    document.querySelectorAll('#candidate-body tr').forEach(tr => {
      const d = tr.querySelector('.cand-date').value;
      const t = tr.querySelector('.cand-time').value;
      if(d && t) candidates.push({ date: d, time: t });
    });
    if(candidates.length === 0) { alert("最低1つの候補日時を入力してください。"); return; }

    document.getElementById('create-spinner').style.display = 'block';
    
    const data = {
      eventName: eventName, location: document.getElementById('event-location').value,
      memo: document.getElementById('event-memo').value,
      deadline: document.getElementById('event-deadline-date').value + " " + document.getElementById('event-deadline-time').value,
      candidates: candidates,
      organizerName: loggedInUser.name, organizerEmail: loggedInUser.email
    };

    try {
      const res = await callApi("createEvent", { data: data });
      // 作成成功したら、そのイベントの管理画面へ移動
      window.location.href = window.location.origin + window.location.pathname + "?eventId=" + res.eventId;
    } catch(e) {
      alert("作成エラー: " + e.message);
      document.getElementById('create-spinner').style.display = 'none';
    }
  }

  // --- 回答画面 (ゲスト用) ---
  async function loadEventData(eventId) {
    try {
      currentEventData = await callApi("getEvent", { eventId: eventId });
      
      document.getElementById('ans-title').textContent = currentEventData.eventName;
      document.getElementById('ans-details').innerHTML = `
        <p style="margin:0 0 5px 0;"><strong>場所:</strong> ${currentEventData.location || "未設定"}</p>
        <p style="margin:0 0 5px 0;"><strong>主催者:</strong> ${currentEventData.organizerName}</p>
        <p style="margin:0; white-space:pre-wrap;"><strong>メッセージ:</strong><br>${currentEventData.memo || "なし"}</p>
      `;
      renderMatrix();
    } catch(e) {
      document.getElementById('ans-title').textContent = "エラー: イベントが見つかりません";
      document.getElementById('ans-details').innerHTML = e.message;
    }
  }

  function renderMatrix() {
    let html = `<table><thead><tr><th>ゲスト名</th>`;
    currentEventData.candidates.forEach(cand => { html += `<th>${cand.date}<br>${cand.time}</th>`; });
    html += `</tr></thead><tbody>`;
    
    // 他のゲストの回答
    currentEventData.answers.forEach(ans => {
      html += `<tr><td style="font-weight:bold;">${ans.guestName}</td>`;
      currentEventData.candidates.forEach((cand, index) => {
        const mark = ans.answersMap[index] || "△";
        const color = mark === '〇' ? 'color:#3498db; font-weight:bold;' : (mark === '×' ? 'color:#e74c3c;' : 'color:#999;');
        html += `<td style="${color}">${mark}</td>`;
      });
      html += `</tr>`;
    });
    
    // あなたの入力行
    html += `<tr style="background:#f1f8ff;"><td><span style="color:#555; font-size:0.9em;">(あなたの回答)</span></td>`;
    currentEventData.candidates.forEach((cand, index) => {
      html += `<td>
        <select id="ans-select-${index}" style="padding:5px; width:100%; border-radius:4px; border:1px solid #ccc; outline:none;">
          <option value="〇">〇</option>
          <option value="△" selected>△</option>
          <option value="×">×</option>
        </select>
      </td>`;
    });
    html += `</tr></tbody></table>`;
    
    document.getElementById('matrix-container').innerHTML = html;
  }

  async function executeSubmitAnswer() {
    const name = document.getElementById('guest-name').value.trim();
    if(!name) { alert("お名前は必須です。"); return; }
    
    let answersMap = {};
    currentEventData.candidates.forEach((cand, index) => {
      answersMap[index] = document.getElementById(`ans-select-${index}`).value;
    });

    document.getElementById('ans-spinner').style.display = 'block';

    try {
      await callApi("submitAnswer", {
        data: { eventId: currentEventId, guestName: name, guestEmail: document.getElementById('guest-email').value, answersMap: answersMap }
      });
      alert("回答を送信しました！");
      window.location.reload();
    } catch(e) {
      alert("送信エラー: " + e.message);
      document.getElementById('ans-spinner').style.display = 'none';
    }
  }
</script>
</body>
</html>
